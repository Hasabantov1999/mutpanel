services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: mut-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mutadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MutPanel2024!}
      POSTGRES_DB: ${POSTGRES_DB:-mutpanel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mutadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mut-demo-app
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mutadmin}:${POSTGRES_PASSWORD:-MutPanel2024!}@db:5432/${POSTGRES_DB:-mutpanel}?schema=public
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-super-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
